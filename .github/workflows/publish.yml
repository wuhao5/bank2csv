name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch, minor, major) or none'
        required: true
        default: 'patch'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (pack and validate without publishing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Verify authorization
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Authorized to publish."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Run Build
        run: pnpm build

      - name: Configure Git
        if: ${{ inputs.bump != 'none' && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version & Push Tag
        if: ${{ inputs.bump != 'none' && !inputs.dry_run }}
        run: |
          pnpm version ${{ inputs.bump }} -m "chore(release): %s [skip ci]"
          git push --follow-tags

      - name: Dry-run Publish
        if: ${{ inputs.dry_run }}
        run: pnpm publish --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        if: ${{ !inputs.dry_run }}
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

